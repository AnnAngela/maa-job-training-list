name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 有新一轮事件时取消仍在跑的旧轮次，节省 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
